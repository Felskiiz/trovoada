[package]
name = "trovoada"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
grib = { version = "0.19.0", default-features = false, features = ["ccsds-unpack-with-rust-aec", "png-unpack-with-png-crate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
