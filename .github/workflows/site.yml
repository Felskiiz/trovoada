# Gera a API como arquivos e força o push dela no branch dados (lido pelo raw.githubusercontent).
# O Pages só republica web/ em push ou disparo manual: o cron não zera mais o cache do CDN.
name: site
on:
 schedule:
 # o GitHub atrasa ou pula disparos em hora cheia; raios e alertas ficam com até ~20 min
 - cron: '7,22,37,52 * * * *'
 workflow_dispatch:
 push:
  branches: [main]
permissions:
 contents: write
 pages: write
 id-token: write
concurrency:
 group: pages
 cancel-in-progress: false
jobs:
 site:
  runs-on: ubuntu-latest
  timeout-minutes: 45
  env:
   XDG_CACHE_HOME: ${{ github.workspace }}/cache
  steps:
  - uses: actions/checkout@v4
  - uses: Swatinem/rust-cache@v2
  # grade do Open-Meteo vale 8 h e leva ~10 min para baixar: vem da rodada anterior
  - uses: actions/cache/restore@v4
    with:
     path: cache/trovoada/openmeteo.json
     key: openmeteo-
     restore-keys: openmeteo-
  - run: cargo build --release
  # painel React (painel/) vira web/painel/, que fica fora do git
  - uses: actions/setup-node@v4
    with:
     node-version: 22
     cache: npm
  - run: npm ci && npx vite build
  - run: cp -r web saida && target/release/trovoada --exportar saida
  - if: hashFiles('cache/trovoada/openmeteo.json') != ''
    uses: actions/cache/save@v4
    with:
     path: cache/trovoada/openmeteo.json
     key: openmeteo-${{ hashFiles('cache/trovoada/openmeteo.json') }}
  - working-directory: saida/api
    run: |
     git init -q -b dados && git add -A
     git -c user.name=trovoada -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm dados
     git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} dados
  - if: github.event_name != 'schedule'
    uses: actions/upload-pages-artifact@v3
    with:
     path: saida
 pages:
  if: github.event_name != 'schedule'
  needs: site
  runs-on: ubuntu-latest
  environment:
   name: github-pages
   url: ${{ steps.deploy.outputs.page_url }}
  steps:
  - id: deploy
    uses: actions/deploy-pages@v4
